name = "bdc-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Stores get <slug>.ROOT_DOMAIN; custom domains are looked up in the DB.
ROOT_DOMAIN = "example.com"

[[d1_databases]]
binding = "DB"
database_name = "bdc"
database_id = "REPLACE_WITH_REAL_ID_AFTER_wrangler_d1_create"
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_REAL_ID_AFTER_wrangler_kv_namespace_create"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bdc-media"
